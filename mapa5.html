<!doctype html>
<html lang="es">
<head>
  <title>Estadios de finales de la Copa del Mundo</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

  <style>
    :root {
      --sidebar-width: 390px;
      --bg: #eef3f8;
      --panel-bg: #ffffff;
      --panel-border: #dbe4ee;
      --title-color: #0d1b2a;
      --text-muted: #5f6b7a;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: #1f2937;
    }

    body {
      overflow: hidden;
    }

    .page-layout {
      display: grid;
      grid-template-columns: minmax(300px, var(--sidebar-width)) 1fr;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #controls {
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 20px 18px;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: var(--shadow);
      z-index: 2;
    }

    .controls-header {
      position: sticky;
      top: 0;
      background: var(--panel-bg);
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid #edf2f7;
      z-index: 3;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      text-decoration: none;
      font-weight: 600;
      color: #0d6efd;
      border: 1px solid #cfe2ff;
      background: #f8fbff;
      padding: 8px 12px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      background: #eaf3ff;
      color: #0a58ca;
    }

    .controls-header h1 {
      font-size: 1.4rem;
      line-height: 1.2;
      margin: 0 0 8px;
      text-align: center;
      color: var(--title-color);
      font-weight: 700;
    }

    .controls-header p {
      margin: 0;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .teams-list {
      display: grid;
      gap: 10px;
    }

    .btn-university {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-weight: 600;
      min-height: 74px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      flex-wrap: wrap;
    }

    .btn-university:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(13, 110, 253, 0.18);
    }

    .btn-university.active {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(13, 110, 253, 0.28);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .team-flag {
      width: 56px;
      height: 40px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.2);
    }

    .vs-text {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .year-text {
      margin-left: auto;
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .map-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #dfe9f3;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    @media (max-width: 991.98px) {
      html,
      body {
        height: auto;
      }

      body {
        overflow: auto;
      }

      .page-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 52vh auto;
        height: auto;
        overflow: visible;
      }

      .map-wrapper {
        order: 1;
        height: 52vh;
        min-height: 52vh;
      }

      #map {
        height: 52vh;
      }

      #controls {
        order: 2;
        height: auto;
        max-height: none;
        border-right: none;
        border-top: 1px solid var(--panel-border);
        box-shadow: none;
        padding: 18px 14px 24px;
      }

      .controls-header {
        position: static;
        padding-bottom: 12px;
      }

      .controls-header h1 {
        font-size: 1.25rem;
      }
    }

    @media (max-width: 575.98px) {
      .page-layout {
        grid-template-rows: 46vh auto;
      }

      .map-wrapper {
        height: 46vh;
        min-height: 46vh;
      }

      #map {
        height: 46vh;
      }

      .btn-university {
        min-height: 78px;
        padding: 10px;
        gap: 8px;
      }

      .team-flag {
        width: 50px;
        height: 36px;
      }

      .year-text {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>
