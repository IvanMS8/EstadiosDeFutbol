<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadios de la Serie A</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">

    <style>
        :root {
            --sidebar-width: 360px;
            --bg: #eef3f8;
            --panel-bg: #ffffff;
            --panel-border: #dbe4ee;
            --title-color: #0d1b2a;
            --text-muted: #5f6b7a;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --radius-lg: 18px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: #1f2937;
        }

        body {
            overflow: hidden;
        }

        .page-layout {
            display: grid;
            grid-template-columns: 1fr minmax(300px, var(--sidebar-width));
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .map-panel {
            position: relative;
            height: 100vh;
            background: #dfe9f3;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-actions {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .map-actions .btn {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
            border-radius: 12px;
        }

        .sidebar {
            height: 100vh;
            background: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 18px 16px 22px;
        }

        .sidebar-header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--panel-bg);
            padding-bottom: 14px;
            margin-bottom: 18px;
            border-bottom: 1px solid #edf2f7;
        }

        .sidebar-header h1 {
            margin: 0 0 8px;
            font-size: 1.45rem;
            line-height: 1.2;
            text-align: center;
            color: var(--title-color);
            font-weight: 700;
        }

        .sidebar-header p {
            margin: 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .info-card {
            background: #f8fbff;
            border: 1px solid #dce9f8;
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 16px;
            color: #24425c;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .carousel-card {
            background: #fff;
            border: 1px solid #e8eef5;
            border-radius: var(--radius-lg);
            padding: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
        }

        .carousel-card h2 {
            font-size: 1rem;
            margin: 2px 6px 10px;
            color: var(--title-color);
            text-align: center;
        }

        .carousel {
            width: 100%;
        }

        .carousel-inner {
            border-radius: 12px;
            overflow: hidden;
        }

        .carousel-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
        }

        @media (max-width: 991.98px) {
            html,
            body {
                height: auto;
            }

            body {
                overflow: auto;
            }

            .page-layout {
                grid-template-columns: 1fr;
                grid-template-rows: 54vh auto;
                height: auto;
                overflow: visible;
            }

            .map-panel {
                order: 1;
                height: 54vh;
                min-height: 54vh;
            }

            .sidebar {
                order: 2;
                height: auto;
                border-left: none;
                border-top: 1px solid var(--panel-border);
                box-shadow: none;
            }

            .sidebar-header {
                position: static;
            }

            .carousel-item img {
                height: 260px;
            }
        }

        @media (max-width: 575.98px) {
            .page-layout {
                grid-template-rows: 46vh auto;
            }

            .map-panel {
                height: 46vh;
                min-height: 46vh;
            }

            .map-actions {
                top: 10px;
                left: 10px;
                right: 10px;
                gap: 8px;
            }

            .map-actions .btn {
                font-size: 0.9rem;
                padding: 0.45rem 0.7rem;
            }

            .sidebar {
                padding: 14px 12px 20px;
            }

            .sidebar-header h1 {
                font-size: 1.2rem;
            }

            .sidebar-header p,
            .info-card {
                font-size: 0.9rem;
            }

            .carousel-item img {
                height: 190px;
            }
        }
    </style>
</head>
<body>
    <main class="page-layout">
        <section class="map-panel">
            <div id="map"></div>

            <div class="map-actions">
                <a href="index.html" class="btn btn-primary">← Volver al menú principal</a>
                <button id="resetButton" class="btn btn-outline-light">Restablecer mapa</button>
            </div>
        </section>

        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Estadios de la Serie A</h1>
            </div>

            <!-- <div class="info-card">
                Haz clic en cualquier marcador del mapa para ver el nombre del estadio y acercarte a su ubicación.
            </div> -->

            <div class="carousel-card">
                <h2>Galería 1</h2>
                <div id="carousel1" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="img2/i1.jpg" alt="Imagen Serie A 1">
                        </div>
                        <div class="carousel-item">
                            <img src="img2/i2.jpg" alt="Imagen Serie A 2">
                        </div>
                        <div class="carousel-item">
                            <img src="img2/i3.jpg" alt="Imagen Serie A 3">
                        </div>
                        <div class="carousel-item">
                            <img src="img2/i4.jpg" alt="Imagen Serie A 4">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carousel1" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carousel1" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Siguiente</span>
                    </button>
                </div>
            </div>

            <div class="carousel-card">
                <h2>Galería 2</h2>
                <div id="carousel2" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="img2/i01.jpg" alt="Imagen Serie A 5">
                        </div>
                        <div class="carousel-item">
                            <img src="img2/i02.webp" alt="Imagen Serie A 6">
                        </div>
                        <div class="carousel-item">
                            <img src="img2/i03.jpg" alt="Imagen Serie A 7">
                        </div>
                        <div class="carousel-item">
                            <img src="img2/i04.jpg" alt="Imagen Serie A 8">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carousel2" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carousel2" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Siguiente</span>
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <script>
        const initialCoords = [41.5331304714057, 12.790569808105827];
        const initialZoom = 6;

        const map = L.map('map', {
            zoomControl: true,
            scrollWheelZoom: true,
            dragging: true,
            touchZoom: true,
            doubleClickZoom: true,
            boxZoom: true,
            keyboard: true
        }).setView(initialCoords, initialZoom);

        L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: 'Map data © Google',
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        const markerLayer1 = L.layerGroup().addTo(map);

        const locations1 = [
            { name: "Juventus Stadium", coords: [45.10955212244513, 7.6412804888308985] },
            { name: "Estadio de San Siro", coords: [45.478125835249664, 9.123987713586239] },
            { name: "Gewiss Stadium", coords: [45.709245252411144, 9.680858766524466] },
            { name: "Stadio Diego Armando Maradona", coords: [40.82796897539936, 14.193023419865991] },
            { name: "Estadio Artemio Franchi", coords: [43.78080347953577, 11.282725314945647] },
            { name: "Stadio Olimpico", coords: [41.93397387372821, 12.454786643255648] },
            { name: "Estadio Renato Dall'Ara", coords: [44.492292099721006, 11.309979325961539] },
            { name: "Stadio Friuli", coords: [46.08153841559609, 13.199926166496182] },
            { name: "Estadio Carlo Castellani", coords: [43.72652240673175, 10.954758016983368] },
            { name: "Estadio Olímpico de Turín", coords: [45.04177118571133, 7.650041555007871] },
            { name: "Estadio Ennio Tardini", coords: [44.79492167540342, 10.338467582750015] },
            { name: "Estadio Luigi Ferraris", coords: [44.41649637562314, 8.952519141247699] },
            { name: "Estadio Sant'Elia", coords: [39.199475660085014, 9.135021243535355] },
            { name: "Stadio Ettore Giardiniero - Via del Mare", coords: [40.36512141773073, 18.208976411861997] },
            { name: "Stadio Comunale G. Sinigaglia", coords: [45.813862121240206, 9.072373289756895] },
            { name: "Stadio Marcantonio Bentegodi", coords: [45.435324508726666, 10.968605814948729] },
            { name: "Estadio Brianteo", coords: [45.5830775915702, 9.30810913879942] },
            { name: "Estadio Pier Luigi Penzo", coords: [45.42778718723838, 12.363989680019838] }
        ];

        locations1.forEach((location) => {
            const marker = L.marker(location.coords).bindPopup(`<strong>${location.name}</strong>`);

            marker.on('click', () => {
                map.flyTo(location.coords, 17, {
                    animate: true,
                    duration: 2.1
                });
            });

            markerLayer1.addLayer(marker);
        });

        function resetMapView() {
            map.flyTo(initialCoords, initialZoom, {
                animate: true,
                duration: 1.8
            });
        }

        document.getElementById('resetButton').addEventListener('click', resetMapView);

        window.addEventListener('load', () => {
            setTimeout(() => {
                map.invalidateSize();
            }, 250);
        });

        window.addEventListener('resize', () => {
            setTimeout(() => {
                map.invalidateSize();
            }, 200);
        });
    </script>
</body>
</html>
